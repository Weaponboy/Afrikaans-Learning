<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afrikaans Leer — Free Local Flashcards</title>
<!-- Bump the ?v= number when data.js/app.js/styles.css/audio-manifest.js change so browsers refetch them. (tools/build_phrases.js does this automatically.) -->
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
<header>
  <h1>🇿🇦 Afrikaans Leer <span class="small">free · local · no account</span></h1>
  <div class="stats">
    <span class="pill" id="streak">🔥 0 day streak</span>
    <span class="pill" id="xp">⭐ 0 XP</span>
    <span class="pill" id="level">Level 1</span>
    <span class="pill" id="started">📚 0 started</span>
    <span class="pill" id="mastered">✅ 0 mastered</span>
  </div>
</header>
<main>
  <div id="view-home"></div>
  <div id="view-study" style="display:none"></div>
</main>
<footer>Progress auto-saves in this browser (localStorage) — no account, works offline. Native Afrikaans audio clips included. Press <span class="kbd">Space</span> to flip, <span class="kbd">1</span>/<span class="kbd">2</span>/<span class="kbd">3</span> to grade.</footer>
<script src="data.js?v=4"></script>
<script src="audio-manifest.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
